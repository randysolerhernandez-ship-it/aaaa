<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* ==================================
   REGISTRO DEL SERVICE WORKER (OFFLINE)
================================== */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker listo para modo offline:', reg.scope))
            .catch(err => console.log('Error en Service Worker:', err));
    });
}

/* ==================================
   SISTEMA DE AUDIO
================================== */
let audioCtx = null;
let temporizadorMotor = 0;

function iniciarAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

window.addEventListener('pointerdown', iniciarAudio, { once: true });

function reproducirSonidoMotor(velocidadActual) {
    if (!audioCtx || velocidadActual < 5) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(45 + (velocidadActual * 1.1), audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } catch (e) {}
}

function reproducirEfectoImpacto() {
    if (!audioCtx) return;
    try {
        const bufferSize = audioCtx.sampleRate * 0.18;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const ruido = audioCtx.createBufferSource();
        ruido.buffer = buffer;
        const filtro = audioCtx.createBiquadFilter();
        filtro.type = 'lowpass';
        filtro.frequency.value = 600;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);

        ruido.connect(filtro);
        filtro.connect(gain);
        gain.connect(audioCtx.destination);
        ruido.start();
    } catch (e) {}
}

/* ==================================
   ESCENA Y AMBIENTE
================================== */

const escena = new THREE.Scene();
escena.background = new THREE.Color(0x87ceeb);
escena.fog = new THREE.Fog(0x87ceeb, 80, 280);

const camara = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
const renderizador = new THREE.WebGLRenderer({ antialias: true });
renderizador.setSize(window.innerWidth, window.innerHeight);
renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.body.appendChild(renderizador.domElement);

escena.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
const sol = new THREE.DirectionalLight(0xffffff, 2);
sol.position.set(20, 30, 20);
escena.add(sol);

const materialAsfalto = new THREE.MeshStandardMaterial({ color: 0x333333 });
const materialBlanco = new THREE.MeshStandardMaterial({ color: 0xffffff });
const materialRojo = new THREE.MeshStandardMaterial({ color: 0xcc2222 });
const materialNaranja = new THREE.MeshStandardMaterial({ color: 0xff5500, roughness: 0.3 });
const materialVerdeBotas = new THREE.MeshStandardMaterial({ color: 0x00cc44, roughness: 0.4 });
const materialGafas = new THREE.MeshStandardMaterial({ color: 0x00ffff, metalness: 0.8, roughness: 0.1 });
const materialHierba = new THREE.MeshStandardMaterial({ color: 0x228b22 });
const materialMontaña = new THREE.MeshStandardMaterial({ color: 0x4a7c59, roughness: 0.9 });
const materialNegro = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });
const materialMetal = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.2 });
const materialAnimal = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.6 });

/* ==================================
   CIRCUITO Y LÍNEA DE META
================================== */

const montañas = [];
for (let i = 0; i < 15; i++) {
    const montaña = new THREE.Mesh(new THREE.ConeGeometry(35 + Math.random() * 20, 45, 4), materialMontaña);
    montaña.position.set((i % 2 === 0 ? 1 : -1) * (70 + Math.random() * 40), 15, -i * 45);
    escena.add(montaña);
    montañas.push(montaña);
}

const terreno = new THREE.Mesh(new THREE.PlaneGeometry(600, 900), materialHierba);
terreno.rotation.x = -Math.PI / 2;
terreno.position.set(0, -0.15, -200);
escena.add(terreno);

const carretera = new THREE.Mesh(new THREE.PlaneGeometry(14, 900), materialAsfalto);
carretera.rotation.x = -Math.PI / 2;
carretera.position.set(0, 0, -200);
escena.add(carretera);

const metaGrupo = new THREE.Group();
const posteIzquierda = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 6), materialBlanco);
posteIzquierda.position.set(-7, 3, 0);
metaGrupo.add(posteIzquierda);

const posteDerecha = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 6), materialBlanco);
posteDerecha.position.set(7, 3, 0);
metaGrupo.add(posteDerecha);

const pancartaMeta = new THREE.Mesh(new THREE.BoxGeometry(14.4, 1.2, 0.3), materialNaranja);
pancartaMeta.position.set(0, 5.8, 0);
metaGrupo.add(pancartaMeta);

const distanciaMeta = 3000;
metaGrupo.position.set(0, 0, -distanciaMeta * 0.08);
escena.add(metaGrupo);

const barrerasIzq = [], barrerasDer = [];
for (let i = 0; i < 70; i++) {
    const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 5), materialNaranja);
    b1.position.set(-7.3, 0.05, -i * 10);
    escena.add(b1);
    barrerasIzq.push(b1);

    const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 5), materialBlanco);
    b2.position.set(7.3, 0.05, -i * 10);
    escena.add(b2);
    barrerasDer.push(b2);
}

const lineas = [];
for (let i = 0; i < 60; i++) {
    const linea = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.035, 4), materialBlanco);
    linea.position.set(0, 0.04, -i * 10);
    escena.add(linea);
    lineas.push(linea);
}

const obstaculos = [];
const carrilesValidos = [-3.8, -1.9, 0, 1.9, 3.8];

for (let i = 0; i < 25; i++) {
    const esAnimal = i % 2 === 0;
    const obstaculoGrupo = new THREE.Group();

    if (esAnimal) {
        const cuerpo = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.8), materialAnimal);
        cuerpo.position.y = 0.25;
        obstaculoGrupo.add(cuerpo);

        const cabeza = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), materialAnimal);
        cabeza.position.set(0, 0.5, -0.4);
        obstaculoGrupo.add(cabeza);
    } else {
        const cono = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.9, 8), materialNaranja);
        cono.position.y = 0.45;
        obstaculoGrupo.add(cono);
    }

    const carrilAleatorio = carrilesValidos[Math.floor(Math.random() * carrilesValidos.length)];
    const zPos = -50 - (i * 100) - Math.random() * 40;

    obstaculoGrupo.position.set(carrilAleatorio, 0, zPos);
    escena.add(obstaculoGrupo);

    obstaculos.push({
        objeto: obstaculoGrupo,
        carril: carrilAleatorio,
        z: zPos,
        activo: true,
        zInicial: zPos
    });
}

const arboles = [];
function crearArbol(x, z) {
    const arbol = new THREE.Group();
    const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, 2, 6), new THREE.MeshStandardMaterial({ color: 0x654321 }));
    tronco.position.y = 1;
    arbol.add(tronco);
    const copa = new THREE.Mesh(new THREE.ConeGeometry(1.3, 3.5, 7), new THREE.MeshStandardMaterial({ color: 0x0b6623 }));
    copa.position.y = 3.2;
    arbol.add(copa);
    arbol.position.set(x, 0, z);
    escena.add(arbol);
    arboles.push(arbol);
}

for (let i = 0; i < 45; i++) {
    crearArbol(-11 - Math.random() * 8, -i * 18);
    crearArbol(11 + Math.random() * 8, -i * 18 - 9);
}

/* ==================================
   MOTOS Y PILOTOS ESTILO MOTOCROSS
================================== */

function crearMotoMotocross(colorHex = 0xff5500) {
    const moto = new THREE.Group();
    const materialColor = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 });

    for (const z of [-1.0, 1.0]) {
        const rueda = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.24, 16), materialNegro);
        rueda.rotation.z = Math.PI / 2;
        rueda.position.set(0, 0.42, z);
        moto.add(rueda);

        const rin = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.26, 10), materialMetal);
        rin.rotation.z = Math.PI / 2;
        rin.position.set(0, 0.42, z);
        moto.add(rin);
    }

    const chasis = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.45, 1.6), materialColor);
    chasis.position.set(0, 0.88, 0);
    chasis.rotation.x = -0.08;
    moto.add(chasis);

    const guardabarros = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.9), materialColor);
    guardabarros.position.set(0, 1.15, -0.55);
    guardabarros.rotation.x = 0.25;
    moto.add(guardabarros);

    const manillar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.1, 8), materialMetal);
    manillar.rotation.z = Math.PI / 2;
    manillar.position.set(0, 1.45, -0.35);
    moto.add(manillar);

    const escape = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.8, 8), materialMetal);
    escape.rotation.x = Math.PI / 2;
    escape.position.set(0.22, 0.95, 0.5);
    moto.add(escape);

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.55, 0.42), materialColor);
    torso.position.set(0, 1.55, 0.02);
    torso.rotation.x = -0.35;
    moto.add(torso);

    for (const x of [-0.25, 0.25]) {
        const bota = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.35, 0.35), materialVerdeBotas);
        bota.position.set(x, 0.65, 0.2);
        moto.add(bota);
    }

    const casco = new THREE.Mesh(new THREE.SphereGeometry(0.26, 14, 12), materialColor);
    casco.position.set(0, 2.12, -0.15);
    moto.add(casco);

    const viseraCasco = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.08, 0.28), materialColor);
    viseraCasco.position.set(0, 2.32, -0.25);
    viseraCasco.rotation.x = 0.3;
    moto.add(viseraCasco);

    const gafas = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.12), materialGafas);
    gafas.position.set(0, 2.14, -0.38);
    moto.add(gafas);

    return moto;
}

const moto = crearMotoMotocross(0xff5500);
moto.position.set(0, 0, 0);
escena.add(moto);

const carriles = [-4.0, -2.0, 0, 2.0, 4.0];
const coloresRivales = [0x00d9ff, 0xffff00, 0xff00ff, 0x00ffcc, 0xffffff];
const nombresRivales = ["Alex", "Bruno", "Carlos", "Diego", "Marco"];
const posicionesIniciales = [[-4.0, -25], [2.0, -40], [-2.0, -55], [4.0, -70], [0, -85]];

const rivales = [];
for (let i = 0; i < 5; i++) {
    const objeto = crearMotoMotocross(coloresRivales[i]);
    objeto.scale.set(0.9, 0.9, 0.9);
    objeto.position.set(posicionesIniciales[i][0], 0, posicionesIniciales[i][1]);
    escena.add(objeto);

    const velAutonoma = 180 + Math.random() * 60;

    rivales.push({
        nombre: nombresRivales[i],
        objeto: objeto,
        velocidadMeta: velAutonoma,
        velocidad: velAutonoma,
        distancia: Math.abs(posicionesIniciales[i][1]),
        carrilActual: posicionesIniciales[i][0],
        carrilObjetivo: posicionesIniciales[i][0],
        zInicial: posicionesIniciales[i][1],
        tiempoCambio: 1.5 + Math.random() * 2.5,
        ordenLlegada: 999,
        terminado: false
    });
}

/* ==================================
   ESTADO DE CARRERA
================================== */

let velocidad = 0;
let inclinacionTelefono = 0;
let acelerando = false;
let frenando = false;
let nitroActivo = false;
let tiempoNitro = 0;

let distanciaCarrera = 0;
let carreraTerminada = false;
let juegoIniciado = false;
let contadorLlegada = 0;
let ordenLlegadaRandy = 999;
let ultimoTiempo = 0;

const limiteIzquierdo = -5.5;
const limiteDerecho = 5.5;

/* ==================================
   CONTROLES Y GIROSCOPIO
================================== */

document.getElementById("btn-giroscopio").addEventListener("click", () => {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
            if (response === 'granted') {
                window.addEventListener('deviceorientation', manejarInclinacion);
                alert("¡Sensor de giro activado!");
            } else {
                alert("Permiso de sensor denegado.");
            }
        }).catch(console.error);
    } else if (typeof window.DeviceOrientationEvent !== 'undefined') {
        window.addEventListener('deviceorientation', manejarInclinacion);
        alert("¡Sensor de giro activado!");
    } else {
        alert("Tu dispositivo no soporta giroscopio.");
    }
});

function manejarInclinacion(evento) {
    let gamma = evento.gamma || 0; 
    inclinacionTelefono = THREE.MathUtils.clamp(gamma / 20, -1, 1);
}

function configurarControl(id, alPresionar, alSoltar) {
    const boton = document.getElementById(id);
    if (!boton) return;
    boton.addEventListener("pointerdown", (e) => { e.preventDefault(); boton.setPointerCapture(e.pointerId); alPresionar(); });
    boton.addEventListener("pointerup", (e) => { e.preventDefault(); alSoltar(); });
    boton.addEventListener("pointercancel", alSoltar);
    boton.addEventListener("lostpointercapture", alSoltar);
}

configurarControl("gas", () => acelerando = true, () => acelerando = false);
configurarControl("freno", () => frenando = true, () => frenando = false);
configurarControl("nitro", () => {
    if (tiempoNitro <= 0) {
        nitroActivo = true;
        tiempoNitro = 3.0;
    }
}, () => {});

document.getElementById("btn-jugar").addEventListener("click", () => {
    document.getElementById("menu-inicio").style.display = "none";
    juegoIniciado = true;
    iniciarAudio();
});

function reiniciarPartida(e) {
    if (e) e.preventDefault();

    velocidad = 0;
    inclinacionTelefono = 0;
    acelerando = false;
    frenando = false;
    nitroActivo = false;
    tiempoNitro = 0;
    distanciaCarrera = 0;
    carreraTerminada = false;
    contadorLlegada = 0;
    ordenLlegadaRandy = 999;

    moto.position.set(0, 0, 0);

    for (let i = 0; i < rivales.length; i++) {
        const r = rivales[i];
        r.distancia = Math.abs(posicionesIniciales[i][1]);
        r.carrilActual = posicionesIniciales[i][0];
        r.carrilObjetivo = posicionesIniciales[i][0];
        r.objeto.position.set(posicionesIniciales[i][0], 0, posicionesIniciales[i][1]);
        r.objeto.visible = true;
        r.ordenLlegada = 999;
        r.terminado = false;
        r.velocidad = r.velocidadMeta;
    }

    for (const obs of obstaculos) {
        obs.z = obs.zInicial;
        obs.activo = true;
        obs.objeto.visible = true;
        obs.objeto.position.z = obs.z;
    }

    document.getElementById("mensaje").style.display = "none";
    document.getElementById("reiniciar").style.display = "none";
}

const btnReiniciar = document.getElementById("reiniciar");
btnReiniciar.addEventListener("click", reiniciarPartida);
btnReiniciar.addEventListener("pointerdown", reiniciarPartida);

/* ==================================
   CLASIFICACIÓN SINCRONIZADA
================================== */

function actualizarClasificacion() {
    const participantes = [{ nombre: "Randy", distancia: Math.min(distanciaCarrera, distanciaMeta), orden: ordenLlegadaRandy, esJugador: true }];
    for (const r of rivales) {
        participantes.push({ nombre: r.nombre, distancia: Math.min(r.distancia, distanciaMeta), orden: r.ordenLlegada, esJugador: false });
    }

    participantes.sort((a, b) => {
        if (a.orden !== 999 || b.orden !== 999) return a.orden - b.orden;
        return b.distancia - a.distancia;
    });

    const pos = participantes.findIndex(p => p.esJugador) + 1;
    document.getElementById("posicion").textContent = "POSICIÓN: " + pos + ".º / 6";
}

/* ==================================
   ACTUALIZAR JUEGO Y CARRERA
================================== */

let tiempoCurva = 0;
let curvaActual = 0;

function actualizarCarrera(delta) {
    if (tiempoNitro > 0) {
        tiempoNitro -= delta;
        velocidad += 150 * delta;
    } else {
        nitroActivo = false;
        if (acelerando) velocidad += 75 * delta;
        else velocidad -= 12 * delta;
    }

    if (frenando) velocidad -= 110 * delta;

    velocidad = THREE.MathUtils.clamp(velocidad, 0, nitroActivo ? 300 : 230);

    temporizadorMotor += delta;
    if (temporizadorMotor > 0.1) {
        reproducirSonidoMotor(velocidad);
        temporizadorMotor = 0;
    }

    moto.position.x += inclinacionTelefono * 8 * delta;
    moto.position.x = THREE.MathUtils.clamp(moto.position.x, limiteIzquierdo, limiteDerecho);
    
    const inclinacionObjetivo = (-inclinacionTelefono * 0.45) - (curvaActual * 2.5);
    moto.rotation.z = THREE.MathUtils.damp(moto.rotation.z, inclinacionObjetivo, 5, delta);

    if (distanciaCarrera < distanciaMeta) {
        distanciaCarrera += velocidad * delta / 3.6;
        if (distanciaCarrera >= distanciaMeta) {
            distanciaCarrera = distanciaMeta;
            if (ordenLlegadaRandy === 999) {
                contadorLlegada++;
                ordenLlegadaRandy = contadorLlegada;
            }
            finalizarCarrera();
        }
    }

    for (const rival of rivales) {
        if (rival.terminado) continue;

        rival.distancia += rival.velocidad * delta / 3.6;
        if (rival.distancia >= distanciaMeta) {
            rival.distancia = distanciaMeta;
            rival.terminado = true;
            contadorLlegada++;
            rival.ordenLlegada = contadorLlegada;
        }
    }

    for (const rival of rivales) {
        const difZ = Math.abs(rival.distancia - distanciaCarrera);
        const difX = Math.abs(moto.position.x - rival.objeto.position.x);

        if (difZ < 4.0 && difX < 1.1) {
            velocidad *= 0.7;
            moto.position.x += (moto.position.x > rival.objeto.position.x ? 0.8 : -0.8);
            reproducirEfectoImpacto();
        }
    }

    for (const obs of obstaculos) {
        if (!obs.activo) continue;

        const difZ = Math.abs(obs.z - (-distanciaCarrera));
        const difX = Math.abs(moto.position.x - obs.carril);

        if (difZ < 3.0 && difX < 0.8) {
            velocidad *= 0.6;
            obs.activo = false;
            obs.objeto.visible = false;
            reproducirEfectoImpacto();
        }
    }

    const textoNitro = tiempoNitro > 0 ? " [TURBO x2]" : "";
    document.getElementById("velocidad").textContent = Math.round(velocidad) + " km/h" + textoNitro;
    document.getElementById("distancia").textContent = "DISTANCIA: " + Math.floor(distanciaCarrera) + " / " + distanciaMeta + " m";
    actualizarClasificacion();
}

function actualizarCircuito(delta) {
    const avance = velocidad * delta / 3.6;
    tiempoCurva += delta * 0.4;

    curvaActual = Math.sin(tiempoCurva) * 0.04;
    escena.position.x = -curvaActual * 60;

    for (const linea of lineas) {
        linea.position.z += avance;
        if (linea.position.z > 12) linea.position.z -= lineas.length * 10;
    }

    for (const b of barrerasIzq) {
        b.position.z += avance;
        if (b.position.z > 12) b.position.z -= barrerasIzq.length * 10;
    }

    for (const b of barrerasDer) {
        b.position.z += avance;
        if (b.position.z > 12) b.position.z -= barrerasDer.length * 10;
    }

    for (const arbol of arboles) {
        arbol.position.z += avance;
        if (arbol.position.z > 15) arbol.position.z -= 45 * 18;
    }

    metaGrupo.position.z = (-distanciaMeta * 0.08) + distanciaCarrera * 0.08;

    for (const obs of obstaculos) {
        obs.z += avance;
        obs.objeto.position.z = obs.z;

        if (obs.z > 12) {
            obs.z = -1200 - Math.random() * 200;
            obs.carril = carrilesValidos[Math.floor(Math.random() * carrilesValidos.length)];
            obs.activo = true;
            obs.objeto.visible = true;
        }
    }

    for (const rival of rivales) {
        if (rival.terminado) {
            rival.objeto.visible = false;
            continue;
        }

        rival.tiempoCambio -= delta;
        if (rival.tiempoCambio <= 0) {
            const opciones = carriles.filter(c => c !== rival.carrilObjetivo);
            rival.carrilObjetivo = opciones[Math.floor(Math.random() * opciones.length)];
            rival.tiempoCambio = 1.5 + Math.random() * 3.0;
        }

        rival.carrilActual = THREE.MathUtils.damp(rival.carrilActual, rival.carrilObjetivo, 2.0, delta);
        rival.objeto.position.x = rival.carrilActual;

        const difDistancia = rival.distancia - distanciaCarrera;
        rival.objeto.position.z = -difDistancia * 0.08;

        if (rival.objeto.position.z < -250) rival.objeto.position.z = -250;
        if (rival.objeto.position.z > 12) rival.objeto.position.z = 12;
    }
}

function finalizarCarrera() {
    if (carreraTerminada) return;
    carreraTerminada = true;
    velocidad = 0;
    acelerando = false;
    frenando = false;

    rivales.forEach(r => {
        if (!r.terminado) {
            contadorLlegada++;
            r.ordenLlegada = contadorLlegada;
            r.terminado = true;
        }
    });

    const participantes = [
        { nombre: "Randy", orden: ordenLlegadaRandy, distancia: distanciaCarrera }
    ];

    for (const r of rivales) {
        participantes.push({ nombre: r.nombre, orden: r.ordenLlegada, distancia: r.distancia });
    }

    participantes.sort((a, b) => a.orden - b.orden);

    const posRandy = participantes.findIndex(p => p.nombre === "Randy") + 1;
    let res = "🏁 ¡CARRERA FINALIZADA!\n\n";
    for (let i = 0; i < participantes.length; i++) {
        res += (i + 1) + ". " + participantes[i].nombre + " — " + Math.floor(participantes[i].distancia) + " m\n";
    }
    res += "\nTerminaste en la posición " + posRandy + " de 6.";

    document.getElementById("mensaje").textContent = res;
    document.getElementById("mensaje").style.display = "block";
    document.getElementById("reiniciar").style.display = "block";
}

function animar(tiempo = 0) {
    requestAnimationFrame(animar);
    const delta = ultimoTiempo === 0 ? 0 : Math.min((tiempo - ultimoTiempo) / 1000, 0.05);
    ultimoTiempo = tiempo;

    if (juegoIniciado && !carreraTerminada) {
        actualizarCarrera(delta);
        actualizarCircuito(delta);
    }

    camara.position.x += (moto.position.x * 0.5 - camara.position.x) * 0.1;
    camara.position.y = 4.5;
    camara.position.z = 8.5;
    camara.lookAt(moto.position.x * 0.3, 1, -8);

    renderizador.render(escena, camara);
}

animar();

window.addEventListener("resize", () => {
    camara.aspect = window.innerWidth / window.innerHeight;
    camara.updateProjectionMatrix();
    renderizador.setSize(window.innerWidth, window.innerHeight);
});
</script>
